<style>
/* Layout: one-column app, emerald title band, gold-ruled cards, fixed bottom tab bar on phones. */
@font-face { font-family: 'JN'; src: url('fonts/jameel-noori.woff2') format('woff2'); font-display: swap; }
:root {
  --bg: #F7F3E9; --paper: #FFFDF7; --ink: #1B2620; --muted: #5E6C63; --line: #E2D8BF;
  --em: #0F5132; --em2: #17704A; --emsoft: #E3EFE7; --gold: #B8892B; --goldsoft: #F6EBCB; --on-em: #FFF6DD;
  --warn: #9A4B12; --warnsoft: #FBE7D3;
  --urdu: 'JN', 'Noto Nastaliq Urdu', 'Jameel Noori Nastaleeq', serif;
  --arabic: 'Amiri', 'Traditional Arabic', serif;
  --shadow: 0 1px 2px rgba(15,81,50,.06), 0 8px 24px rgba(15,81,50,.08);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D1612; --paper: #14211B; --ink: #EDE8DA; --muted: #A3B3A9; --line: #2A3B33;
  --em: #0C3A25; --em2: #1C7A50; --emsoft: #1A2E24; --gold: #D4AA4F; --goldsoft: #2E2814; --on-em: #FFF1CC;
  --warn: #F0A36A; --warnsoft: #3A2414; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0D1612; --paper: #14211B; --ink: #EDE8DA; --muted: #A3B3A9; --line: #2A3B33;
  --em: #0C3A25; --em2: #1C7A50; --emsoft: #1A2E24; --gold: #D4AA4F; --goldsoft: #2E2814; --on-em: #FFF1CC;
  --warn: #F0A36A; --warnsoft: #3A2414; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark; }

html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--urdu); direction: rtl; line-height: 2.1; font-size: 17px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--em); }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--em2); }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; border-radius: 6px; }

/* ---------- header ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--em);
  background-image: radial-gradient(circle at 12px 12px, rgba(212,170,79,.18) 2px, transparent 2.5px); background-size: 24px 24px;
  border-bottom: 3px solid var(--gold); color: var(--on-em); }
.top .in { max-width: 980px; margin: 0 auto; padding-block: 8px 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 6px; }
.brand { display: flex; align-items: center; gap: 12px; justify-content: space-between; }
.brand h1 { margin: 0; font-size: 26px; font-weight: 700; line-height: 1.9; text-wrap: balance; }
.brand small { display: block; font-size: 14px; opacity: .85; line-height: 1.6; }
.star { width: 38px; height: 38px; flex: none; }
.tabs { display: flex; gap: 4px; }
.tabs a { text-decoration: none; color: var(--on-em); padding: 2px 14px; border-radius: 999px; font-size: 16px; line-height: 2; opacity: .85; }
.tabs a[aria-current="page"] { background: var(--gold); color: #1B1405; opacity: 1; }
.themebtn { background: transparent; border: 1px solid rgba(255,246,221,.4); color: var(--on-em); border-radius: 999px; width: 38px; height: 38px; cursor: pointer; flex: none; line-height: 1; font-family: system-ui; }

main { max-width: 980px; margin: 0 auto; padding-block: 18px 120px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; }

/* ---------- search ---------- */
.searchbox { position: relative; }
.searchbox input { width: 100%; border: 2px solid var(--line); background: var(--paper); border-radius: 16px; padding: 6px 52px 6px 16px; font-size: 20px; line-height: 2.2; box-shadow: var(--shadow); }
.searchbox input:focus { border-color: var(--gold); outline: none; }
.searchbox svg { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); width: 22px; height: 22px; color: var(--muted); }
.hint { color: var(--muted); font-size: 14px; margin: 4px 4px 0; line-height: 1.9; }
.results { display: grid; gap: 8px; }
.res { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center; text-align: right; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 6px 14px; cursor: pointer; width: 100%; }
.res:hover { border-color: var(--gold); }
.res .nm { font-size: 19px; font-weight: 600; min-width: 0; }
.res .chain { grid-column: 1 / -1; color: var(--muted); font-size: 14px; line-height: 1.9; min-width: 0; }
.chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 0 10px; font-size: 13px; line-height: 1.9; white-space: nowrap; background: var(--emsoft); color: var(--em2); }
.chip.gold { background: var(--goldsoft); color: var(--gold); }
.chip.warn { background: var(--warnsoft); color: var(--warn); }

/* ---------- cards ---------- */
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; box-shadow: var(--shadow); min-width: 0; }
.card h2 { margin: 0 0 6px; font-size: 21px; color: var(--em2); font-weight: 700; display: flex; align-items: center; gap: 8px; }
.card h2::before { content: ""; width: 10px; height: 10px; background: var(--gold); transform: rotate(45deg); flex: none; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; }
.stats { display: flex; flex-wrap: wrap; gap: 10px 22px; }
.stat b { font-size: 28px; color: var(--em2); font-variant-numeric: tabular-nums; display: block; line-height: 1.6; }
.stat span { color: var(--muted); font-size: 14px; }
.branches { display: grid; gap: 8px; }
.branch { display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: right; width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 4px 12px; cursor: pointer; }
.branch:hover { border-color: var(--gold); }
.verse { font-family: var(--arabic); font-size: 22px; line-height: 2; text-align: center; color: var(--em2); margin: 0; }
.verse + p { text-align: center; color: var(--muted); font-size: 15px; margin: 0; }

/* ---------- person ---------- */
.hero { background: var(--em); color: var(--on-em); border-radius: 20px; padding: 16px 20px; display: grid; gap: 4px; border: 2px solid var(--gold); position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; inset: auto -40px -60px auto; width: 180px; height: 180px; border: 2px solid rgba(212,170,79,.35); transform: rotate(45deg); }
.hero .nm { font-size: 32px; font-weight: 700; line-height: 2; text-wrap: balance; position: relative; z-index: 1; }
.hero .meta { display: flex; flex-wrap: wrap; gap: 6px; position: relative; z-index: 1; }
.hero .chip { background: rgba(255,246,221,.14); color: var(--on-em); }
.hero .chip.gold { background: var(--gold); color: #1B1405; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 0 16px; line-height: 2.3; cursor: pointer; font-size: 15px; text-decoration: none; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--gold); }
.btn.primary { background: var(--em2); color: #fff; border-color: var(--em2); }
.btn.gold { background: var(--gold); color: #1B1405; border-color: var(--gold); }

.family { display: grid; gap: 10px; justify-items: center; }
.fam-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.pbox { border: 1.5px solid var(--line); background: var(--paper); border-radius: 12px; padding: 0 14px; cursor: pointer; line-height: 2.2; font-size: 17px; text-align: center; }
.pbox:hover { border-color: var(--gold); }
.pbox.me { border: 2.5px solid var(--gold); background: var(--goldsoft); font-weight: 700; font-size: 19px; cursor: default; }
.pbox.sib { color: var(--muted); font-size: 15px; }
.conn { width: 2px; height: 16px; background: var(--muted); opacity: .5; }
.lbl { color: var(--muted); font-size: 13px; line-height: 1.6; }

.lineage { list-style: none; margin: 0; padding: 0; display: grid; }
.lineage li { display: grid; grid-template-columns: 54px 1fr; align-items: center; gap: 10px; position: relative; }
.lineage li::before { content: ""; position: absolute; right: 26px; top: 0; bottom: 0; width: 2px; background: var(--line); }
.lineage li:first-child::before { top: 50%; } .lineage li:last-child::before { bottom: 50%; }
.lineage .g { position: relative; z-index: 1; justify-self: center; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--paper); border: 2px solid var(--gold); color: var(--em2); font-size: 15px; line-height: 1; font-variant-numeric: tabular-nums; }
.lineage button.nmb { text-align: right; background: none; border: 0; padding: 2px 0; cursor: pointer; font-size: 17px; line-height: 2; }
.lineage button.nmb:hover { color: var(--em2); text-decoration: underline; text-decoration-color: var(--gold); }
.lineage li.cur .g { background: var(--gold); color: #1B1405; }
.lineage li.cur .nmb { font-weight: 700; }
.lineage li.gap .nmb { color: var(--em2); font-size: 15px; }
.rel { color: var(--muted); font-size: 13px; margin-inline-start: 8px; }

.note { background: var(--goldsoft); border-radius: 12px; padding: 6px 14px; font-size: 15px; line-height: 2; }
.note.warn { background: var(--warnsoft); color: var(--warn); }

/* ---------- tree explorer ---------- */
.treebar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tree { list-style: none; margin: 0; padding: 0; overflow-x: auto; }
.tree ul { list-style: none; margin: 0; padding: 0 22px 0 0; border-right: 2px solid var(--line); margin-right: 13px; }
.tree li { position: relative; }
.tree ul > li::before { content: ""; position: absolute; right: -22px; top: 1.15em; width: 18px; border-top: 2px solid var(--line); }
.node { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.tg { width: 26px; height: 26px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); cursor: pointer; display: grid; place-items: center; font-family: system-ui; font-size: 14px; line-height: 1; padding: 0; flex: none; }
.tg[disabled] { visibility: hidden; }
.tn { background: none; border: 0; padding: 0 6px; cursor: pointer; font-size: 17px; line-height: 2.2; border-radius: 8px; }
.tn:hover { background: var(--emsoft); }
.tn.hl { background: var(--goldsoft); }
.tn.mark { outline: 2px solid var(--gold); }
.cnt { color: var(--muted); font-size: 12px; font-family: system-ui; font-variant-numeric: tabular-nums; }

/* ---------- forms ---------- */
.form { display: grid; gap: 12px; }
.field { display: grid; gap: 2px; }
.field label { font-size: 15px; color: var(--muted); }
.field input, .field select, .field textarea { border: 1.5px solid var(--line); background: var(--bg); border-radius: 12px; padding: 4px 12px; line-height: 2; font-size: 17px; width: 100%; }
.field textarea { min-height: 110px; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--gold); outline: none; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg label { border: 1.5px solid var(--line); border-radius: 999px; padding: 0 14px; line-height: 2.2; cursor: pointer; font-size: 15px; }
.seg label { position: relative; } .seg input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; margin: 0; pointer-events: none; }
.seg input:checked + span { color: var(--em2); font-weight: 700; }
.seg label:has(input:checked) { border-color: var(--em2); background: var(--emsoft); }
.out { white-space: pre-wrap; background: var(--bg); border: 1px dashed var(--gold); border-radius: 12px; padding: 10px 14px; font-size: 15px; line-height: 2; user-select: all; }
.picker { position: relative; }
.picker .drop { position: absolute; inset: 100% 0 auto 0; z-index: 5; background: var(--paper); border: 1px solid var(--gold); border-radius: 12px; max-height: 280px; overflow: auto; box-shadow: var(--shadow); }
.picker .drop button { display: block; width: 100%; text-align: right; border: 0; background: none; padding: 2px 12px; cursor: pointer; line-height: 2; font-size: 16px; }
.picker .drop button:hover, .picker .drop button:focus { background: var(--emsoft); }
.picker .drop small { color: var(--muted); font-size: 13px; }
.chosen { font-size: 15px; color: var(--em2); }

.result-rel { text-align: center; display: grid; gap: 4px; }
.result-rel .big { font-size: 26px; font-weight: 700; color: var(--em2); line-height: 2; }
.paths { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.paths ol { margin: 0; padding: 0 18px 0 0; font-size: 15px; }

footer { color: var(--muted); font-size: 14px; text-align: center; display: grid; gap: 2px; padding-top: 8px; border-top: 1px solid var(--line); }
footer b { color: var(--ink); font-weight: 600; }

.toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); border-radius: 999px; padding: 0 18px; line-height: 2.4; font-size: 15px; z-index: 40; }

@media (max-width: 720px) {
  body { font-size: 16px; }
  .brand h1 { font-size: 21px; }
  .top .tabs { display: none; }
  .bottombar { position: fixed; inset: auto 0 0 0; z-index: 25; background: var(--paper); border-top: 2px solid var(--gold); display: grid; grid-template-columns: repeat(4, 1fr);
    padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
  .bottombar a { text-decoration: none; color: var(--muted); display: grid; justify-items: center; font-size: 13px; line-height: 1.8; padding-top: 6px; }
  .bottombar a svg { width: 22px; height: 22px; }
  .bottombar a[aria-current="page"] { color: var(--em2); font-weight: 700; }
  .hero .nm { font-size: 26px; }
  .paths { grid-template-columns: 1fr; }
}
@media (min-width: 721px) { .bottombar { display: none; } }
@media (prefers-reduced-motion: no-preference) { .res, .pbox, .branch, .btn { transition: border-color .15s, background .15s; } }
</style>

</head>

 علی شاہ","f":"p650","c":[],"g":39,"s":6,"ref":"ر-۱۴"},{"id":"p654","n":"زاہد علی شاہ","f":"p650","c":[],"g":39,"s":6,"ref":"ر-۱۴"},{"id":"p655","n":"وقار علی شاہ","f":"p650","c":["p660","p659"],"g":39,"s":6,"ref":"ذ-۱۴"},{"id":"p656","n":"ذوالفقار شاہ","f":"p605","c":["p662","p661"],"g":39,"s":6,"ref":"ذ-۱۴"},{"id":"p657","n":"مشتاق شاہ","f":"p605","c":["p663"],"g":39,"s":6,"ref":"ذ-۱۴"},{"id":"p658","n":"نصیر احمد شاہ","f":"p651","c":[],"g":39,"s":6,"ref":"ر-۱۴"},{"id":"p659","n":"سید ثناء اللہ شاہ","f":"p655","c":[],"g":40,"s":6,"ref":"ذ-۱۴"},{"id":"p660","n":"سید شیر شاہ","f":"p655","c":[],"g":40,"s":6,"ref":"ذ-۱۴"},{"id":"p661","n":"زوہیب علی شاہ","f":"p656","c":[],"g":40,"s":6,"ref":"ذ-۱۴"},{"id":"p662","n":"فراز علی شاہ","f":"p656","c":[],"g":40,"s":6,"ref":"ذ-۱۴"},{"id":"p663","n":"حمزہ شاہ","f":"p657","c":[],"g":40,"s":6,"ref":"ذ-۱۴"},{"id":"p664","n":"کفایت علی شاہ","f":"p386","c":["p500"],"g":38,"s":4,"ref":"د-۹"},{"id":"p665","n":"شجاعت علی شاہ","f":"p386","c":["p503","p504","p505"],"g":38,"s":4,"ref":"د-۹"},{"id":"p666","n":"عثمان شاہ","f":"p452","c":[],"g":39,"s":6,"ref":"ر-۱۴"}]}</script>
<script>
/* ===== Settings (edit after creating the GitHub repository) ===== */
const CONFIG = {
  githubRepo: 'syedmaaez/shajra-gilani-datta',          // e.g. 'syedmaaez/shajra-gilani-datta' — enables "GitHub پر بھیجیں"
  whatsapp: '',            // e.g. '923001234567' — family maintainer's WhatsApp number (digits only)
  posterPdf: 'shajra-poster.pdf'
};

const U = n => String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let DATA, P = {}, ROOT = 'R', DATTA = 'p270';

function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

/* ---------- normalisation & search ---------- */
const norm = s => (s || '').replace(/[ً-ٰٟ۪-ۭ]/g, '')
  .replace(/[يى]/g, 'ی').replace(/ك/g, 'ک').replace(/[هۃة]/g, 'ہ').replace(/[أإآ]/g, 'ا').replace(/ؤ/g, 'و').replace(/ئ/g, 'ی')
  .replace(/[()\[\]،۔.,\-ـ]/g, ' ').replace(/\s+/g, ' ').trim();
const UR2LAT = {'ب':'b','پ':'p','ت':'t','ٹ':'t','ط':'t','ث':'s','س':'s','ص':'s','ج':'j','چ':'c','ح':'h','ہ':'h','ھ':'h','خ':'x','د':'d','ڈ':'d','ذ':'z','ز':'z','ض':'z','ظ':'z','ژ':'z','ر':'r','ڑ':'r','ش':'S','غ':'g','گ':'g','ف':'f','ق':'k','ک':'k','ل':'l','م':'m','ن':'n'};
const skelUr = s => [...norm(s)].map(c => c === ' ' ? ' ' : (UR2LAT[c] || '')).join('').replace(/ +/g, ' ').trim();
const skelLat = s => s.toLowerCase().replace(/sh/g,'S').replace(/ch/g,'c').replace(/kh/g,'x').replace(/gh/g,'g').replace(/th/g,'t').replace(/ph/g,'f')
  .replace(/q/g,'k').replace(/c(?!$)/g, m => m).replace(/[aeiouyw'v]/g,'').replace(/[^a-zS ]/g,'').replace(/(.)\1+/g,'$1').replace(/ +/g,' ').trim();
const dedupe = s => s.replace(/(.)\1+/g, '$1');

function search(q) {
  q = q.trim(); if (!q) return [];
  const latin = /[a-z]/i.test(q);
  const toks = latin ? skelLat(q).split(' ').filter(Boolean) : norm(q).split(' ').filter(Boolean);
  const out = [];
  for (const p of Object.values(P)) {
    if (p.id === 'R') continue;
    const hay = latin ? p._sk : p._n;
    if (!toks.every(t => hay.includes(t))) continue;
    let sc = 0;
    const full = latin ? toks.join(' ') : norm(q);
    if (hay === full) sc += 100; else if (hay.startsWith(full)) sc += 50; else if (hay.includes(full)) sc += 25;
    sc -= Math.abs(hay.length - full.length) * .2;
    if (latin) { const raw = q.toLowerCase().replace(/sh/g,'S').replace(/ch/g,'c').replace(/kh/g,'x').replace(/gh/g,'g').replace(/th/g,'t').replace(/ph/g,'f').replace(/q/g,'k').replace(/[aeiouyw'v]/g,'').replace(/[^a-zS ]/g,'').replace(/ +/g,' ').trim(); if (p._sk2.includes(raw)) sc += 40; if (p._sk2 === raw) sc += 40; }
    sc += p.g / 100;
    out.push([sc, p]);
  }
  return out.sort((a, b) => b[0] - a[0]).slice(0, 60).map(x => x[1]);
}

/* ---------- tree helpers ---------- */
function ancestors(id) { const a = []; let p = P[id]; while (p) { a.push(p.id); p = P[p.f]; } return a; }
function chainText(p, n = 3) { const a = []; let f = P[p.f]; while (f && a.length < n) { a.push(f.id === 'R' ? 'حضور ﷺ' : f.n); f = P[f.f]; } return a.length ? 'بن ' + a.join(' ← ') : ''; }
function descCount(id) { let c = 0, st = [...P[id].c]; while (st.length) { const x = st.pop(); c++; st.push(...P[x].c); } return c; }
const label = p => p.id === 'R' ? 'حضرت محمد مصطفےٰ ﷺ' : p.n;

/* ---------- relationship ---------- */
function upWord(n) { return ['', 'والد', 'دادا', 'پردادا', 'سکڑدادا', 'نکڑدادا'][n] || `${U(n)} پشت اوپر جدِ امجد`; }
function downWord(n) { return ['', 'بیٹا', 'پوتا', 'پڑپوتا', 'سکڑپوتا', 'نکڑپوتا'][n] || `${U(n)} پشت نیچے اولاد`; }
function relation(aId, bId) {
  if (aId === bId) return { big: 'ایک ہی شخص', a: 0, b: 0, lca: aId };
  const A = ancestors(aId), B = ancestors(bId), setA = new Map(A.map((x, i) => [x, i]));
  let j = 0; while (j < B.length && !setA.has(B[j])) j++;
  const lca = B[j], a = setA.get(lca), b = j;
  let big;
  if (a === 0) big = `${label(P[bId])}، ${label(P[aId])} کے ${downWord(b)} ہیں`;
  else if (b === 0) big = `${label(P[bId])}، ${label(P[aId])} کے ${upWord(a)} ہیں`;
  else if (a === 1 && b === 1) big = 'سگے بھائی';
  else if (a === 2 && b === 1) big = `${label(P[bId])}، ${label(P[aId])} کے چچا / تایا ہیں`;
  else if (a === 1 && b === 2) big = `${label(P[bId])}، ${label(P[aId])} کے بھتیجے ہیں`;
  else if (a === 2 && b === 2) big = 'چچا زاد بھائی (فرسٹ کزن)';
  else if (a === 3 && b === 3) big = 'دوسرے درجے کے چچا زاد (سیکنڈ کزن)';
  else if (a === b) big = `${U(a - 1)}ویں درجے کے چچا زاد`;
  else if (a > b) big = `${label(P[bId])}، ${label(P[aId])} سے ${U(a - b)} پشت اوپر کی نسل میں ہیں`;
  else big = `${label(P[bId])}، ${label(P[aId])} سے ${U(b - a)} پشت نیچے کی نسل میں ہیں`;
  return { big, a, b, lca, A: A.slice(0, a + 1), B: B.slice(0, b + 1) };
}

/* ---------- views ---------- */
const app = document.getElementById('app');
function setNav(view) {
  document.querySelectorAll('.tabs a, .bottombar a').forEach(a => a.toggleAttribute('aria-current', a.getAttribute('href') === '#' + view) || a.removeAttribute('aria-current'));
  document.querySelectorAll('.tabs a, .bottombar a').forEach(a => { if (a.getAttribute('href') === '#' + view) a.setAttribute('aria-current', 'page'); });
}
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.append(t); setTimeout(() => t.remove(), 2200); }
async function copy(text, btn) {
  try { await navigator.clipboard.writeText(text); toast('کاپی ہو گیا'); }
  catch (e) { const r = document.createRange(); const el = btn?.closest('.card')?.querySelector('.out'); if (el) { r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } toast('متن منتخب ہے، کاپی کر لیں'); }
}
function go(h) { if (location.hash === '#' + h) route(); else location.hash = h; }

function resultsHTML(list) {
  if (!list.length) return '<p class="hint">کوئی نام نہیں ملا۔ ہجے بدل کر دیکھیں یا صرف نام کا ایک حصہ لکھیں (مثلاً «امداد»).</p>';
  return list.map(p => `<button class="res" type="button" data-go="${p.id}">
    <span class="nm">${esc(p.n)}</span><span class="chip">پشت ${U(p.g)}</span>
    <span class="chain">${esc(chainText(p))}</span></button>`).join('');
}

function viewHome() {
  setNav('home');
  const q = store('shajra.q') || '';
  const total = Object.keys(P).length - 1;
  const maxG = Math.max(...Object.values(P).map(p => p.g));
  const secs = DATA.meta.sections;
  const roots = { 2: 'p270', 3: 'p244', 4: 'p251', 5: 'p281', 6: 'p289', 7: 'p280' };
  app.innerHTML = `
    <section class="card" aria-labelledby="s-h">
      <h2 id="s-h">اپنا نام تلاش کریں</h2>
      <div class="searchbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="q" type="search" placeholder="مثلاً: امداد علی شاہ" value="${esc(q)}" autocomplete="off" aria-label="نام تلاش کریں"></div>
      <p class="hint">اردو یا انگریزی حروف میں لکھیں (مثلاً Imdad Ali)۔ ایک جیسے ناموں میں فرق کے لیے ہر نتیجے کے ساتھ والد اور دادا کے نام دیے گئے ہیں۔</p>
      <div class="results" id="res" style="margin-top:10px"></div>
    </section>
    <div class="grid2">
      <section class="card"><h2>شاخیں (حصے)</h2><div class="branches">
        ${Object.entries(roots).map(([k, id]) => `<button class="branch" type="button" data-tree="${id}"><span>حصہ ${U(k)}: ${esc(secs[k])}</span><span class="cnt">${U(descCount(id))}</span></button>`).join('')}
        <button class="branch" type="button" data-tree="R"><span>مکمل شجرہ: حضور اکرم ﷺ سے</span><span class="cnt">${U(total)}</span></button>
      </div></section>
      <section class="card"><h2>ایک نظر میں</h2>
        <div class="stats">
          <div class="stat"><b>${U(total)}</b><span>نام</span></div>
          <div class="stat"><b>${U(maxG)}</b><span>پشتیں حضور ﷺ تک</span></div>
          <div class="stat"><b>${U(descCount(DATTA))}</b><span>اولادِ سید وزیر الدین شاہ</span></div>
        </div>
        <p class="hint">«پشت» سے مراد حضور اکرم ﷺ سے نسلوں کا شمار ہے۔ ایک ہی پشت کے لوگ ایک ہی نسل کے ہیں۔</p>
        <div class="actions" style="margin-top:8px"><a class="btn gold" href="${esc(CONFIG.posterPdf)}" target="_blank" rel="noopener">پوسٹر (PDF) دیکھیں</a><a class="btn" href="#suggest">نام شامل یا درست کریں</a></div>
      </section>
    </div>
    <section class="card"><p class="verse">وَجَعَلْنَاكُمْ شُعُوبًا وَقَبَائِلَ لِتَعَارَفُوا</p><p>اور ہم نے تمہیں قومیں اور قبیلے بنایا تاکہ تم ایک دوسرے کو پہچانو۔ (الحجرات: ۱۳)</p></section>
    ${footer()}`;
  const inp = document.getElementById('q'), res = document.getElementById('res');
  const run = () => { store('shajra.q', inp.value); res.innerHTML = inp.value.trim() ? resultsHTML(search(inp.value)) : resultsHTML(search('امداد علی شاہ')).replace('', ''); };
  inp.addEventListener('input', run); run();
  if (!q) res.insertAdjacentHTML('afterbegin', '<p class="hint">مثال کے طور پر «امداد علی شاہ» کے نتائج:</p>');
}

function footer() {
  const m = DATA.meta;
  return `<footer>${m.credits.map(c => `<div>${esc(c[0])}: <b>${esc(c[1])}</b></div>`).join('')}<div>اشاعتِ اول: ${esc(m.published)} • ڈیجیٹل ورژن: ${U(esc(m.version))}</div></footer>`;
}

function viewPerson(id) {
  const p = P[id]; if (!p) return viewHome();
  setNav('');
  const f = P[p.f], gf = f && P[f.f];
  const sibs = f ? f.c.filter(x => x !== id) : [];
  const anc = ancestors(id).reverse();
  const meId = store('shajra.me');
  let lin = '';
  const show = anc.length > 14 ? new Set([...anc.slice(0, 3), ...anc.slice(-9)]) : new Set(anc);
  let gapDone = false;
  anc.forEach((aid, i) => {
    if (!show.has(aid)) { if (!gapDone) { lin += `<li class="gap"><span class="g">⋮</span><button class="nmb" type="button" id="expandLin">درمیان کی ${U(anc.length - show.size)} پشتیں دکھائیں</button></li>`; gapDone = true; } return; }
    const a = P[aid], up = anc.length - 1 - i;
    lin += `<li class="${aid === id ? 'cur' : ''}"><span class="g">${U(a.g)}</span><span><button class="nmb" type="button" data-go="${aid}">${esc(label(a))}</button>${up >= 1 && up <= 4 ? `<span class="rel">${upWord(up)}</span>` : ''}</span></li>`;
  });
  app.innerHTML = `
    <section class="hero">
      <div class="nm">${esc(label(p))}</div>
      <div class="meta"><span class="chip gold">پشت ${U(p.g)}</span>${p.s ? `<span class="chip">حصہ ${U(p.s)}</span>` : ''}${p.ref ? `<span class="chip">پوسٹر پر خانہ ${esc(p.ref)}</span>` : ''}${p.tag ? `<span class="chip">${esc(p.tag)}</span>` : ''}${p.c.length ? `<span class="chip">${U(p.c.length)} بیٹے • ${U(descCount(id))} کل اولاد</span>` : ''}</div>
    </section>
    <div class="actions">
      <button class="btn primary" type="button" data-tree="${id}">شجرے میں دیکھیں</button>
      <button class="btn" type="button" id="relBtn">رشتہ معلوم کریں</button>
      <button class="btn" type="button" id="meBtn">${meId === id ? '✓ یہ میں ہوں' : 'یہ میں ہوں'}</button>
      <button class="btn" type="button" id="shareBtn">لنک کاپی کریں</button>
      <a class="btn gold" href="#suggest" id="fixBtn">اولاد شامل کریں / اصلاح</a>
    </div>
    ${p.chk ? `<p class="note warn">اس نام کی تحریر اصل شجرہ کی تصویر میں واضح نہیں تھی۔ اگر ہجے درست نہیں تو «اصلاح» میں بتائیں۔</p>` : ''}
    ${p.note ? `<p class="note">${esc(p.note)}</p>` : ''}
    ${p.fn ? `<p class="note">حاشیہ ${U(p.fn)}: ${esc(p.fnt)}</p>` : ''}
    ${p.spouse ? `<p class="note">زوج: ${esc(p.spouse)}</p>` : ''}${p.mother ? `<p class="note">والدہ: ${esc(p.mother)}</p>` : ''}
    <div class="grid2">
      <section class="card"><h2>خاندان</h2>
        <div class="family">
          ${gf ? `<span class="lbl">دادا</span><button class="pbox" type="button" data-go="${gf.id}">${esc(label(gf))}</button><span class="conn"></span>` : ''}
          ${f ? `<span class="lbl">والد</span><button class="pbox" type="button" data-go="${f.id}">${esc(label(f))}</button><span class="conn"></span>` : ''}
          <div class="fam-row"><span class="pbox me">${esc(label(p))}</span>${sibs.map(s => `<button class="pbox sib" type="button" data-go="${s}">${esc(P[s].n)}</button>`).join('')}</div>
          ${sibs.length ? `<span class="lbl">ساتھ میں بھائی</span>` : ''}
          ${p.c.length ? `<span class="conn"></span><span class="lbl">بیٹے</span><div class="fam-row">${p.c.map(c => `<button class="pbox" type="button" data-go="${c}">${esc(P[c].n)}</button>`).join('')}</div>` : `<span class="lbl">اس شجرہ میں آگے اولاد درج نہیں</span>`}
        </div></section>
      <section class="card"><h2>سلسلۂ نسب</h2><ol class="lineage" id="lin">${lin}</ol></section>
    </div>
    ${footer()}`;
  document.getElementById('expandLin')?.addEventListener('click', () => {
    document.getElementById('lin').innerHTML = anc.map((aid, i) => { const a = P[aid], up = anc.length - 1 - i;
      return `<li class="${aid === id ? 'cur' : ''}"><span class="g">${U(a.g)}</span><span><button class="nmb" type="button" data-go="${aid}">${esc(label(a))}</button>${up >= 1 && up <= 4 ? `<span class="rel">${upWord(up)}</span>` : ''}</span></li>`; }).join('');
  });
  document.getElementById('meBtn').onclick = () => { store('shajra.me', id); toast('محفوظ ہو گیا: «رشتہ» میں آپ کا نام پہلے سے بھرا ہوگا'); viewPerson(id); };
  document.getElementById('relBtn').onclick = () => { store('shajra.relB', id); go('relation'); };
  document.getElementById('fixBtn').onclick = () => store('shajra.target', id);
  document.getElementById('shareBtn').onclick = e => copy(location.href.split('#')[0] + '#' + id, e.target);
  window.scrollTo({ top: 0 });
}

function viewTree(startId) {
  setNav('tree');
  const start = startId && P[startId] ? startId : (store('shajra.treeRoot') || DATTA);
  const focus = startId && P[startId] ? startId : null;
  const rootId = focus ? (focus === 'R' || focus === DATTA || ['p244','p251','p281','p289','p280'].includes(focus) ? focus : DATTA) : start;
  const openSet = new Set();
  if (focus) ancestors(focus).forEach(a => openSet.add(a));
  const isUnder = (x, r) => ancestors(x).includes(r);
  const actualRoot = focus && !isUnder(focus, rootId) ? 'R' : rootId;
  openSet.add(actualRoot);
  P[actualRoot].c.forEach(c => { if (actualRoot !== 'R') openSet.add(c); });
  app.innerHTML = `
    <section class="card"><h2>شجرہ</h2>
      <div class="treebar">
        <select id="treeRoot" aria-label="کہاں سے شروع کریں">
          <option value="p270">سید وزیر الدین شاہ (داتا)</option><option value="R">حضور اکرم ﷺ سے مکمل</option>
          <option value="p244">حاجی سید فقیر شاہ</option><option value="p281">حاجی سید رسول شاہ</option><option value="p280">سید سخی نادر شاہ</option><option value="p251">حضرت شاہ</option><option value="p289">شیر شاہ</option>
        </select>
        <button class="btn" type="button" id="expAll">سب کھولیں</button><button class="btn" type="button" id="colAll">سب بند کریں</button>
      </div>
      <p class="hint">＋ دبا کر بیٹے دیکھیں۔ کسی نام پر دبائیں تو اس کا خاندان اور سلسلۂ نسب کھلے گا۔ بڑا بیٹا اوپر ہے۔</p>
      <ul class="tree" id="tree"></ul>
    </section>${footer()}`;
  const sel = document.getElementById('treeRoot'); sel.value = ['R','p270','p244','p281','p280','p251','p289'].includes(actualRoot) ? actualRoot : 'p270';
  const tree = document.getElementById('tree');
  function li(id) {
    const p = P[id], open = openSet.has(id), n = p.c.length;
    return `<li data-id="${id}"><div class="node"><button class="tg" type="button" ${n ? '' : 'disabled'} aria-expanded="${open}" aria-label="${open ? 'بند کریں' : 'کھولیں'}">${open ? '−' : '+'}</button>
      <button class="tn ${p.hl ? 'hl' : ''} ${id === focus ? 'mark' : ''}" type="button" data-go="${id}">${esc(label(p))}</button>${n ? `<span class="cnt">${U(n)}</span>` : ''}</div>
      ${open && n ? `<ul>${p.c.map(li).join('')}</ul>` : ''}</li>`;
  }
  const draw = () => { tree.innerHTML = li(actualRoot); };
  draw();
  tree.addEventListener('click', e => {
    const t = e.target.closest('.tg'); if (!t) return;
    const id = t.closest('li').dataset.id; openSet.has(id) ? openSet.delete(id) : openSet.add(id);
    const node = t.closest('li'); node.outerHTML = li(id);
  });
  sel.onchange = () => { store('shajra.treeRoot', sel.value); location.hash = 'tree'; viewTree(); };
  document.getElementById('expAll').onclick = () => { const st = [actualRoot]; while (st.length) { const x = st.pop(); openSet.add(x); st.push(...P[x].c); } draw(); };
  document.getElementById('colAll').onclick = () => { openSet.clear(); openSet.add(actualRoot); draw(); };
  if (focus) setTimeout(() => tree.querySelector('.mark')?.scrollIntoView({ block: 'center', behavior: 'smooth' }), 50);
}

function picker(id, initial, lab) {
  return `<div class="field picker" id="${id}"><label for="${id}-i">${lab}</label><input id="${id}-i" type="search" placeholder="نام لکھیں…" autocomplete="off" value="${initial ? esc(P[initial].n) : ''}"><div class="drop" hidden></div><div class="chosen">${initial ? esc(chainText(P[initial], 2)) : ''}</div></div>`;
}
function bindPicker(id, onPick, initial) {
  const box = document.getElementById(id), inp = box.querySelector('input'), drop = box.querySelector('.drop'), ch = box.querySelector('.chosen');
  let val = initial || null;
  inp.addEventListener('input', () => {
    const r = search(inp.value).slice(0, 12); drop.hidden = !r.length;
    drop.innerHTML = r.map(p => `<button type="button" data-v="${p.id}">${esc(p.n)} <small>${esc(chainText(p, 2))}</small></button>`).join('');
  });
  drop.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; val = b.dataset.v; inp.value = P[val].n; ch.textContent = chainText(P[val], 2); drop.hidden = true; onPick(val); });
  inp.addEventListener('blur', () => setTimeout(() => drop.hidden = true, 200));
  return () => val;
}

function viewRelation() {
  setNav('relation');
  const a0 = store('shajra.me'), b0 = store('shajra.relB');
  app.innerHTML = `<section class="card"><h2>دو افراد کا رشتہ</h2>
    <p class="hint">دو نام چنیں؛ شجرہ ان کے مشترکہ جد اور آپس کا رشتہ بتائے گا۔</p>
    <div class="grid2">${picker('pa', P[a0] ? a0 : null, 'پہلا فرد (مثلاً آپ)')}${picker('pb', P[b0] ? b0 : null, 'دوسرا فرد')}</div>
    <div id="relOut" style="margin-top:12px"></div></section>${footer()}`;
  let A = P[a0] ? a0 : null, B = P[b0] ? b0 : null;
  const out = document.getElementById('relOut');
  const show = () => {
    if (!A || !B) { out.innerHTML = '<p class="hint">دونوں نام منتخب کریں۔</p>'; return; }
    const r = relation(A, B), L = P[r.lca];
    out.innerHTML = `<div class="result-rel"><div class="big">${esc(r.big)}</div>
      <div>مشترکہ جد: <button class="pbox" type="button" data-go="${L.id}">${esc(label(L))}</button></div>
      <p class="hint">${esc(P[A].n)} سے ${U(r.a)} پشت اوپر، اور ${esc(P[B].n)} سے ${U(r.b)} پشت اوپر</p></div>
      ${r.A ? `<div class="paths"><div><b>${esc(P[A].n)}</b><ol>${r.A.map(x => `<li>${esc(label(P[x]))}</li>`).join('')}</ol></div><div><b>${esc(P[B].n)}</b><ol>${r.B.map(x => `<li>${esc(label(P[x]))}</li>`).join('')}</ol></div></div>` : ''}`;
  };
  bindPicker('pa', v => { A = v; store('shajra.me', v); show(); }, A);
  bindPicker('pb', v => { B = v; store('shajra.relB', v); show(); }, B);
  show();
}

function viewSuggest() {
  setNav('suggest');
  const t0 = store('shajra.target');
  const draft = (() => { try { return JSON.parse(store('shajra.draft') || '{}'); } catch (e) { return {}; } })();
  app.innerHTML = `<section class="card"><h2>نام شامل کریں یا اصلاح بھیجیں</h2>
    <p class="hint">نئی نسل کے نام شامل کرنے، کسی نام کے ہجے درست کرنے یا رشتہ درست کرنے کے لیے یہ فارم بھریں۔ آپ کی تجویز شجرہ کے منتظمین کو جائے گی؛ تصدیق کے بعد شجرہ میں شامل کی جائے گی۔</p>
    <form class="form" id="sf" novalidate>
      <div class="field"><span style="font-size:15px;color:var(--muted)">کیا کرنا ہے؟</span><div class="seg" role="radiogroup">
        <label><input type="radio" name="kind" value="add" ${draft.kind !== 'fix' && draft.kind !== 'other' ? 'checked' : ''}><span>بیٹے / اولاد شامل کریں</span></label>
        <label><input type="radio" name="kind" value="fix" ${draft.kind === 'fix' ? 'checked' : ''}><span>نام یا رشتہ درست کریں</span></label>
        <label><input type="radio" name="kind" value="other" ${draft.kind === 'other' ? 'checked' : ''}><span>کچھ اور</span></label></div></div>
      ${picker('pt', P[t0] ? t0 : null, 'شجرہ میں موجود فرد (جس کی اولاد شامل کرنی ہے یا جس کا نام درست کرنا ہے)')}
      <div class="field"><label for="newNames" id="nnLbl">نئے نام (ہر نام نئی سطر میں، بڑے سے چھوٹے)</label><textarea id="newNames" placeholder="سید …&#10;سید …">${esc(draft.newNames || '')}</textarea></div>
      <div class="field"><label for="details">مزید تفصیل یا حوالہ (اختیاری)</label><textarea id="details" style="min-height:80px" placeholder="مثلاً: اصل شجرہ میں یہ نام غلط پڑھا گیا ہے، درست نام …">${esc(draft.details || '')}</textarea></div>
      <div class="grid2"><div class="field"><label for="who">آپ کا نام</label><input id="who" value="${esc(draft.who || '')}"></div>
      <div class="field"><label for="contact">رابطہ (فون یا ای میل)</label><input id="contact" value="${esc(draft.contact || '')}" dir="ltr" style="text-align:right"></div></div>
      <button class="btn primary" type="submit" style="justify-self:start">تجویز تیار کریں</button>
    </form>
    <div id="sOut" style="margin-top:14px"></div></section>
    <section class="card"><h2>تجویز کیسے پہنچتی ہے</h2>
      <p class="hint">«GitHub پر بھیجیں» سے شجرہ کے ریکارڈ میں ایک درخواست (issue) کھلتی ہے جسے منتظمین دیکھ کر شامل کرتے ہیں۔ GitHub اکاؤنٹ نہ ہو تو متن کاپی کر کے WhatsApp پر بھیج دیں۔</p></section>${footer()}`;
  let T = P[t0] ? t0 : null;
  bindPicker('pt', v => { T = v; store('shajra.target', v); }, T);
  const sf = document.getElementById('sf');
  const kindLbl = () => { const k = sf.kind.value; document.getElementById('nnLbl').textContent = k === 'add' ? 'نئے نام (ہر نام نئی سطر میں، بڑے سے چھوٹے)' : k === 'fix' ? 'درست نام یا درست رشتہ' : 'آپ کی بات'; };
  sf.addEventListener('change', kindLbl); kindLbl();
  sf.addEventListener('input', () => store('shajra.draft', JSON.stringify({ kind: sf.kind.value, newNames: newNames.value, details: details.value, who: who.value, contact: contact.value })));
  sf.addEventListener('submit', e => {
    e.preventDefault();
    const k = sf.kind.value, names = newNames.value.split('\n').map(s => s.trim()).filter(Boolean);
    const out = document.getElementById('sOut');
    if (!T && k !== 'other') { out.innerHTML = '<p class="note warn">شجرہ میں سے فرد منتخب کریں: اوپر نام لکھ کر فہرست میں سے چنیں۔</p>'; return; }
    if (!names.length && !details.value.trim()) { out.innerHTML = '<p class="note warn">نیا نام یا تفصیل لکھیں۔</p>'; return; }
    const t = T ? P[T] : null;
    const kindTxt = { add: 'اولاد کا اضافہ', fix: 'اصلاح', other: 'دیگر' }[k];
    const title = `${kindTxt}: ${t ? t.n : ''}`.trim();
    const lines = [`نوعیت: ${kindTxt}`];
    if (t) lines.push(`فرد: ${t.n} (${t.id}) — ${chainText(t, 3)}`, `پشت: ${t.g}`);
    if (names.length) lines.push(k === 'add' ? 'نئے بیٹے:' : 'درست معلومات:', ...names.map(n => '- ' + n));
    if (details.value.trim()) lines.push('تفصیل: ' + details.value.trim());
    lines.push(`بھیجنے والے: ${who.value || '—'} | رابطہ: ${contact.value || '—'}`);
    const json = { type: k, target: t ? t.id : null, names, details: details.value.trim(), from: who.value, contact: contact.value };
    const body = lines.join('\n') + '\n\n```json\n' + JSON.stringify(json, null, 1) + '\n```';
    const gh = CONFIG.githubRepo ? `https://github.com/${CONFIG.githubRepo}/issues/new?labels=${encodeURIComponent(k === 'add' ? 'addition' : 'correction')}&title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}` : '';
    const wa = `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(lines.join('\n'))}`;
    out.innerHTML = `<div class="out" id="outTxt">${esc(lines.join('\n'))}</div>
      <div class="actions" style="margin-top:10px">
        ${gh ? `<a class="btn primary" href="${gh}" target="_blank" rel="noopener">GitHub پر بھیجیں</a>` : ''}
        <a class="btn gold" href="${wa}" target="_blank" rel="noopener">WhatsApp پر بھیجیں</a>
        <button class="btn" type="button" id="cp">متن کاپی کریں</button></div>
      ${gh ? '' : '<p class="hint">GitHub ریپوزٹری بننے کے بعد یہاں براہِ راست بھیجنے کا بٹن بھی آ جائے گا۔</p>'}`;
    document.getElementById('cp').onclick = ev => copy(lines.join('\n'), ev.target);
  });
}

/* ---------- router ---------- */
function route() {
  const h = location.hash.slice(1);
  if (h === 'tree') return viewTree();
  if (h === 'relation') return viewRelation();
  if (h === 'suggest') return viewSuggest();
  if (h && (P[h])) return viewPerson(h);
  if (h.startsWith('tree-') && P[h.slice(5)]) return viewTree(h.slice(5));
  viewHome();
}
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g && !g.closest('.drop')) { e.preventDefault(); go(g.dataset.go); return; }
  const t = e.target.closest('[data-tree]'); if (t) { go('tree-' + t.dataset.tree); }
});
window.addEventListener('hashchange', route);

/* ---------- theme ---------- */
(function () {
  const saved = store('shajra.theme'); if (saved) document.documentElement.dataset.theme = saved;
  document.getElementById('themeBtn').onclick = () => {
    const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const nx = cur === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = nx; store('shajra.theme', nx);
  };
})();

/* ---------- boot ---------- */
function load(d) {
  DATA = d; P = {};
  d.people.forEach(p => { P[p.id] = p; p._n = norm(p.n); p._sk = dedupe(skelUr(p.n)); p._sk2 = skelUr(p.n); });
  DATTA = d.meta.datta || DATTA;
  route();
}
load(JSON.parse(document.getElementById('seed').textContent));
fetch('data.json', { cache: 'no-cache' }).then(r => r.ok ? r.json() : null).then(d => { if (d && d.meta && d.meta.version !== DATA.meta.version) load(d); }).catch(() => {});
</script>
